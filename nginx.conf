# Link unfurlers get server-rendered Open Graph tags from the og service; people get the app.
map $http_user_agent $is_unfurler {
    default 0;
    ~*(discordbot|twitterbot|facebookexternalhit|slackbot|telegrambot|whatsapp|linkedinbot|redditbot|embedly|skypeuripreview|mastodon|bluesky|iframely) 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Resolve og at request time so nginx still starts when og is down.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $og http://og:8787;

    location / {
        if ($is_unfurler) { proxy_pass $og; }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location /og/ { proxy_pass $og; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
