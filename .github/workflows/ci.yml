# Every PR and every push to main: the typecheck, both test suites and the sidecar's tests, the same ones
# AGENTS.md asks for before shipping. Nothing here deploys; that's still `npm run deploy` from Shlok's machine.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Bun runs golf's determinism check under JavaScriptCore, the engine iPhones use.
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npx vite build

  sidecar:
    name: Stonks sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stonks
      - run: cargo test --manifest-path stonks/Cargo.toml

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chromium-headless-shell
      # The throwaway Convex backend, pinned to kiwi's image (e2e/backend.mjs).
      - run: docker pull ghcr.io/convex/convex-backend@sha256:01aaebb72d7e9a32c82d183b3a25ffe15278f4dc656ecf30b21777691929d1ab
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results
          retention-days: 7
