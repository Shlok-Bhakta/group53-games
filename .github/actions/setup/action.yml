name: Node and node_modules
description: Node 22 with node_modules from the cache, installed and cached once per lockfile.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - id: modules
      uses: actions/cache/restore@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
    # Saved straight after npm ci, before an e2e job adds Playwright's browsers to node_modules.
    - if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}
