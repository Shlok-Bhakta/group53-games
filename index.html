<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="theme-color" content="#0a291c" />
    <script>
      // platform: iOS paints the page before the stylesheet arrives when it reopens the app from cold.
      try {
        var t = localStorage.getItem("theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.dataset.palette = localStorage.getItem("palette") || "felt";
        root.dataset.font = localStorage.getItem("font") || "oxanium";
        var bg = localStorage.getItem(dark ? "bg-dark" : "bg-light") || (dark ? "#0a291c" : "#eaf3ed");
        root.style.colorScheme = dark ? "dark" : "light";
        root.style.backgroundColor = bg;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", bg);
      } catch (e) {}
      // platform: a page whose app script never runs stays blank with no way out on a home screen app, so it drops the saved copy once and loads again.
      addEventListener("load", function () {
        if (document.documentElement.dataset.booted || !navigator.onLine || !navigator.serviceWorker || !navigator.serviceWorker.controller)
          return;
        try {
          if (sessionStorage.getItem("boot-retried")) return;
          sessionStorage.setItem("boot-retried", "1");
        } catch (e) {
          return;
        }
        var again = function () {
          location.reload();
        };
        window.caches ? caches.delete("group53-shell").then(again, again) : again();
      });
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Group 53" />
    <title>Group 53 Games</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
